<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link
      href="https://raw.githubusercontent.com/Material-Home-Assistant/material-home-assistant.github.io/main/assets/img/logo/logo.png"
      rel="icon"
      type="image/png"
    />
    <title>Page not found</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;600;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-dark: #0a0a0a;
        --cyan: #06b6d4;
        --purple: #8b5cf6;
        --glass: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
      }

      /* Desktop Style (Originale) */
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "Google Sans Flex", sans-serif;
        background-color: var(--bg-dark);
        color: #fff;
        overflow: hidden;
      }
      .hero-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(
            circle at 20% 30%,
            rgba(6, 182, 212, 0.15) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 80% 70%,
            rgba(139, 92, 246, 0.15) 0%,
            transparent 40%
          );
        z-index: -1;
      }
      .error-container {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .glass-card {
        background: var(--glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 32px;
        padding: 3rem;
        max-width: 600px;
        width: 100%;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .error-code {
        font-size: 7rem;
        font-weight: 900;
        background: linear-gradient(135deg, var(--cyan), var(--purple));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
        margin-bottom: 1rem;
      }
      .error-status {
        font-size: 1.75rem;
        font-weight: 600;
        margin-bottom: 1rem;
      }
      .error-message {
        font-size: 0.95rem;
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      .trace-id {
        font-family: monospace;
        font-size: 0.7rem;
        color: rgba(255, 255, 255, 0.2);
        margin-bottom: 1.5rem;
        text-transform: uppercase;
      }
      .btn-custom {
        all: unset;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: linear-gradient(135deg, var(--cyan), var(--purple));
        color: white;
        padding: 12px 28px;
        border-radius: 100px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
        text-decoration: none;
      }
      .btn-custom:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(6, 182, 212, 0.3);
        color: #fff;
      }
      .footer-info {
        position: absolute;
        bottom: 1.5rem;
        width: 100%;
        text-align: center;
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.2);
      }

      /* --- OTTIMIZZAZIONE MOBILE (NO SCROLL) --- */
      @media (max-width: 767px) {
        body,
        html {
          height: 100dvh;
          overflow: hidden; /* Blocca lo scroll del body */
        }
        .error-container {
          height: 100dvh; /* Usa l'altezza dinamica per evitare tagli */
          padding: 15px;
        }
        .glass-card {
          padding: 1.5rem;
          border-radius: 24px;
        }
        .error-code {
          font-size: 4rem;
          margin-bottom: 0.5rem;
        }
        .error-status {
          font-size: 1.25rem;
          margin-bottom: 0.75rem;
        }
        .error-message {
          font-size: 0.85rem;
          margin-bottom: 1.5rem;
          padding: 0 10px;
        }
        .trace-id {
          font-size: 0.55rem;
          word-break: break-all;
          margin-bottom: 1.5rem;
        }
        .btn-custom {
          width: 100%;
          box-sizing: border-box;
          padding: 12px 0;
          font-size: 0.9rem;
        }
        .footer-info {
          bottom: 1rem;
          font-size: 0.7rem;
        }
        img {
          width: 80px !important; /* Logo più piccolo per risparmiare spazio verticale */
          margin-bottom: 1rem !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="hero-bg"></div>
    <div class="error-container">
      <div class="glass-card">
        <img
          src="https://raw.githubusercontent.com/Material-Home-Assistant/material-home-assistant.github.io/main/assets/img/logo/logo.svg"
          alt="Logo"
          style="width: 100px; margin-bottom: 1.5rem"
        />
        <div class="error-code">404</div>
        <div class="error-status">Page Not Found</div>
        <div class="error-message">
          The page <b><span id="current-domain-2"></span></b> you are looking
          for does not exist.
        </div>
        <div
          class="d-flex flex-column flex-md-row gap-2 gap-md-3 justify-content-center"
        >
          <button class="btn-custom" onclick="location.reload()">
            <i class="bi bi-arrow-clockwise"></i> Retry
          </button>
          <a
            href="https://materialhomeassistant.com"
            class="btn-custom"
            style="
              background: var(--glass);
              border: 1px solid var(--glass-border);
            "
            ><i class="bi bi-house"></i> Home Page</a
          >
        </div>
      </div>
    </div>
    <div class="footer-info">
      Subdomain: <span id="current-domain"></span> •
      <i class="bi bi-shield-check"></i> Secure Node
    </div>
    <script>
      // Prende il nome del dominio (es. service.materialhomeassistant.com)
      const domain = window.location.hostname;
      // Lo inserisce nello span con id "current-domain"
      document.getElementById("current-domain").textContent = domain;
      document.getElementById("current-domain-2").textContent = domain;
    </script>
  </body>
</html>
